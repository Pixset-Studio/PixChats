name: Build PixChats Mobile (.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Вычислить единую версию сборки по номеру коммита
        id: ver
        shell: bash
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "count=${COMMIT_COUNT}" >> $GITHUB_OUTPUT
          echo "version=0.2.${COMMIT_COUNT}" >> $GITHUB_OUTPUT

      - name: Install dependencies (весь монорепозиторий)
        run: npm install

      - name: Собрать веб-версию (без basePath — упаковывается прямо в APK)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kibhezfpafhitcvpkquu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYmhlemZwYWZoaXRjdnBrcXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxOTI4NjUsImV4cCI6MjA5OTc2ODg2NX0.HO1uskn4k7AWmFNFpFXd2vdgO8BKYz_bb8lpj2znSoI' }}
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.version }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Скопировать веб-сборку в apps/mobile/www
        working-directory: apps/mobile
        run: node copy-web-dist.js

      - name: Создать нативный Android-проект (не хранится в репозитории)
        working-directory: apps/mobile
        run: npx cap add android

      - name: Сгенерировать иконки и сплэш-экран из логотипа PixChats
        working-directory: apps/mobile
        run: npx capacitor-assets generate --android

      - name: Синхронизировать веб-код, постоянный ключ подписи и нативный Android-мост
        working-directory: apps/mobile
        env:
          GITHUB_RUN_NUMBER: ${{ steps.ver.outputs.count }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npx cap sync android
          node configure-android-native.js

      - name: Собрать нативный .apk (с постоянной подписью для обновления поверх старого APK)
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Подготовить единый файл PixChats.apk
        run: |
          APK_FILE=$(ls apps/mobile/android/app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" apps/mobile/android/app/build/outputs/apk/debug/PixChats.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PixChats-Android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/PixChats.apk
          retention-days: 30

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pixchats-release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Скачать собранный .apk артефакт
        uses: actions/download-artifact@v4
        with:
          name: PixChats-Android-apk
          path: release-assets

      - name: Удалить старый Release и опубликовать новую версию с «Что нового», .exe и .apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p release-assets

          # 1. Сохраняем .exe из предыдущего актуального релиза (чтобы в релизе всегда были и .exe, и .apk)
          EXISTING_TAGS=$(gh api "repos/$REPO/releases" --jq '.[].tag_name' || true)
          for TAG in $EXISTING_TAGS; do
            gh release download "$TAG" --repo "$REPO" --pattern "*.exe" --dir release-assets --clobber && break || true
          done

          # 2. Удаляем все старые релизы и старые теги, чтобы в репозитории оставался только актуальный релиз
          OLD_IDS=$(gh api "repos/$REPO/releases" --jq '.[].id' || true)
          for ID in $OLD_IDS; do
            gh api -X DELETE "repos/$REPO/releases/$ID" || true
          done
          for TAG in $EXISTING_TAGS; do
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          done
          git push origin :refs/tags/lastest-version 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          # 3. Формируем единую детерминированную версию по числу коммитов + список «Что нового»
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_STR="0.2.${COMMIT_COUNT}"
          TAG_NAME="v${VERSION_STR}"
          RELEASE_TITLE="PixChats v${VERSION_STR}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RECENT_COMMITS=$(git log -n 6 --pretty=format:"• %s" 2>/dev/null || echo "• Улучшение стабильности и производительности")

          NOTES=$(cat <<EOF
          ### ✨ Что нового в PixChats v${VERSION_STR}:
          ${RECENT_COMMITS}
          • Управление активными устройствами и сеансами в настройках («Устройства») с мгновенным завершением сессий
          • Полное удаление сообщений («Удалить у меня» и «Удалить у всех») без заглушки «Сообщение удалено»
          • Автоматическая фоновая самоустановка обновлений на ПК (.exe) и Android (.apk) поверх текущей версии

          ---
          📦 **Техническая информация сборки:**
          - Версия: v${VERSION_STR}
          - Commit: ${SHA}
          - Build-Time: ${BUILD_TIME}
          EOF
          )

          gh release create "$TAG_NAME" release-assets/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest
