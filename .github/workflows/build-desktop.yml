name: Build PixChats Desktop (.exe)

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop workspace dependencies explicitly
        run: npm install --workspace=apps/desktop

      - name: Собрать Windows-инсталлятор
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kibhezfpafhitcvpkquu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run dist --workspace=apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: PixChats-Windows-Installer
          path: apps/desktop/release/*.exe
          retention-days: 30
