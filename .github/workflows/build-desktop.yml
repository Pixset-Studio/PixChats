name: Build PixChats Desktop (.exe)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (весь монорепозиторий)
        run: npm install

      - name: Собрать веб-версию (без basePath для десктопа)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://kibhezfpafhitcvpkquu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpYmhlemZwYWZoaXRjdnBrcXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxOTI4NjUsImV4cCI6MjA5OTc2ODg2NX0.HO1uskn4k7AWmFNFpFXd2vdgO8BKYz_bb8lpj2znSoI' }}
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_APP_VERSION: 0.2.${{ github.run_number }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Скопировать веб-сборку в apps/desktop/web-dist
        working-directory: apps/desktop
        run: node copy-web-dist.js

      - name: Собрать Windows-инсталлятор (.exe)
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never

      - name: Подготовить единый файл PixChats-Setup.exe
        shell: bash
        run: |
          EXE_FILE=$(ls apps/desktop/release/*.exe | head -n 1)
          if [ -n "$EXE_FILE" ] && [ "$EXE_FILE" != "apps/desktop/release/PixChats-Setup.exe" ]; then
            cp "$EXE_FILE" apps/desktop/release/PixChats-Setup.exe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PixChats-Windows-Installer
          path: apps/desktop/release/PixChats-Setup.exe
          retention-days: 30

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pixchats-release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15

      - name: Скачать собранный .exe артефакт
        uses: actions/download-artifact@v4
        with:
          name: PixChats-Windows-Installer
          path: release-assets

      - name: Удалить старый Release и опубликовать новую версию с «Что нового», .exe и .apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          mkdir -p release-assets

          # 1. Сохраняем .apk из предыдущего актуального релиза (чтобы в релизе всегда были и .exe, и .apk)
          EXISTING_TAGS=$(gh api "repos/$REPO/releases" --jq '.[].tag_name' || true)
          for TAG in $EXISTING_TAGS; do
            gh release download "$TAG" --repo "$REPO" --pattern "*.apk" --dir release-assets --clobber && break || true
          done

          # 2. Удаляем все старые релизы и старые теги, чтобы в репозитории оставался только актуальный релиз
          OLD_IDS=$(gh api "repos/$REPO/releases" --jq '.[].id' || true)
          for ID in $OLD_IDS; do
            gh api -X DELETE "repos/$REPO/releases/$ID" || true
          done
          for TAG in $EXISTING_TAGS; do
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          done
          git push origin :refs/tags/lastest-version 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

          # 3. Формируем список «Что нового» из последних коммитов + ключевых обновлений релиза
          VERSION_STR="0.2.${RUN_NUM}"
          TAG_NAME="v${VERSION_STR}"
          RELEASE_TITLE="PixChats v${VERSION_STR}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RECENT_COMMITS=$(git log -n 6 --pretty=format:"• %s" 2>/dev/null || echo "• Улучшение стабильности и производительности")

          NOTES=$(cat <<EOF
          ### ✨ Что нового в PixChats v${VERSION_STR}:
          ${RECENT_COMMITS}
          • Стабильная передача звука и видео в личных звонках, голосовых чатах групп и прямых эфирах каналов
          • Обновление Android (.apk) устанавливается поверх текущей версии без удаления приложения (единый ключ подписи и авто-инкремент versionCode)
          • Система автообновления с подробным списком изменений для Windows (.exe) и Android (.apk)

          ---
          📦 **Техническая информация сборки:**
          - Версия: v${VERSION_STR}
          - Commit: ${SHA}
          - Build-Time: ${BUILD_TIME}
          EOF
          )

          gh release create "$TAG_NAME" release-assets/* \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest
